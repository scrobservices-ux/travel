# ---------------------------------------------------------------------------
# Orderly — one-command self-host (no Vercel).
#
#   cp .env.example .env.local   # fill in your keys
#   docker compose up -d --build
#   # → http://localhost:3000   (put Nginx/Caddy in front for HTTPS + domain)
#
# Data lives in your managed Supabase project (set in .env.local). For full EU
# data residency you can also self-host Supabase; see README.
# ---------------------------------------------------------------------------
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
