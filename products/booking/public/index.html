<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réserver</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
         background: #faf7f0; color: #1f2421; padding: 1.25rem; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 1rem 0 0.25rem; }
  p.sub { color: #6b6259; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 1rem 0 0.3rem; }
  select, input { width: 100%; padding: 0.7rem; font-size: 1rem; border: 1px solid #d9d2c4;
                  border-radius: 8px; background: #fff; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.3rem; }
  .slot { padding: 0.6rem 0; text-align: center; border: 1px solid #d9d2c4; border-radius: 8px;
          background: #fff; cursor: pointer; font-size: 0.95rem; }
  .slot.sel { background: #1f7a4d; color: #fff; border-color: #1f7a4d; }
  button.submit { width: 100%; margin-top: 1.5rem; padding: 0.9rem; font-size: 1.05rem;
                  background: #1f7a4d; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  button.submit:disabled { background: #aaa; }
  .msg { margin-top: 1rem; padding: 0.9rem; border-radius: 8px; display: none; }
  .msg.ok { display: block; background: #e3f3ea; color: #1f7a4d; }
  .msg.err { display: block; background: #fdeaea; color: #b03030; }
</style>
</head>
<body>
  <h1 id="bizName">…</h1>
  <p class="sub">Réservez en moins d'une minute. Confirmation par WhatsApp.</p>

  <label>Service</label>
  <select id="service"></select>

  <label>Date</label>
  <input type="date" id="date">

  <label>Heure</label>
  <div class="slots" id="slots"><span style="color:#6b6259">Choisissez une date</span></div>

  <label>Votre nom</label>
  <input type="text" id="name" placeholder="Nom complet">

  <label>Votre numéro WhatsApp</label>
  <input type="tel" id="phone" placeholder="6XX XX XX XX">

  <button class="submit" id="submit" disabled>Confirmer la réservation</button>
  <div class="msg" id="msg"></div>

<script>
  let selectedTime = null;

  async function init() {
    const cfg = await (await fetch('/api/config')).json();
    document.getElementById('bizName').textContent = cfg.name;
    document.title = 'Réserver — ' + cfg.name;
    const sel = document.getElementById('service');
    cfg.services.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id;
      o.textContent = `${s.label} — ${s.price.toLocaleString('fr-FR')} FCFA`;
      sel.appendChild(o);
    });
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('date').min = today;
  }

  async function loadSlots() {
    selectedTime = null;
    update();
    const date = document.getElementById('date').value;
    const box = document.getElementById('slots');
    if (!date) return;
    box.textContent = '…';
    const { slots } = await (await fetch('/api/slots?date=' + date)).json();
    box.innerHTML = '';
    if (!slots.length) { box.innerHTML = '<span style="color:#6b6259">Fermé ou complet ce jour</span>'; return; }
    slots.forEach(t => {
      const b = document.createElement('button');
      b.className = 'slot'; b.textContent = t; b.type = 'button';
      b.onclick = () => {
        document.querySelectorAll('.slot').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); selectedTime = t; update();
      };
      box.appendChild(b);
    });
  }

  function update() {
    const ok = selectedTime
      && document.getElementById('name').value.trim()
      && document.getElementById('phone').value.trim();
    document.getElementById('submit').disabled = !ok;
  }

  async function submit() {
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    const res = await fetch('/api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        serviceId: document.getElementById('service').value,
        date: document.getElementById('date').value,
        time: selectedTime,
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
      }),
    });
    if (res.ok) {
      msg.className = 'msg ok';
      msg.textContent = '✅ Réservation confirmée ! Vous recevrez une confirmation WhatsApp.';
    } else if (res.status === 409) {
      msg.className = 'msg err';
      msg.textContent = 'Ce créneau vient d\'être pris — choisissez-en un autre.';
      loadSlots();
    } else {
      msg.className = 'msg err';
      msg.textContent = 'Erreur — réessayez ou contactez-nous sur WhatsApp.';
    }
  }

  document.getElementById('date').addEventListener('change', loadSlots);
  document.getElementById('name').addEventListener('input', update);
  document.getElementById('phone').addEventListener('input', update);
  document.getElementById('submit').addEventListener('click', submit);
  init();
</script>
</body>
</html>
