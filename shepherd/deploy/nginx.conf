# nginx in front of Shepherd, if you already run nginx.
# Get the certificate with: sudo certbot --nginx -d shepherd.example.org

server {
    listen 443 ssl http2;
    server_name shepherd.example.org;

    ssl_certificate     /etc/letsencrypt/live/shepherd.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shepherd.example.org/privkey.pem;

    # Uploaded congregation files.
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name shepherd.example.org;
    return 301 https://$host$request_uri;
}
