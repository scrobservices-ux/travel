# Shepherd behind Caddy, which gets a TLS certificate automatically.
#
#   1. Point your domain's A record at this machine.
#   2. Put the domain and your email in .env next to this file:
#        DOMAIN=shepherd.example.org
#        [email protected]
#   3. docker compose up -d
#
# The congregation's data lives in the shepherd-data volume. Back it up with:
#   docker compose exec shepherd tar -c server/data | gzip > shepherd-backup.tar.gz

services:
  shepherd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      TRUST_PROXY: 1
    volumes:
      - shepherd-data:/app/server/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - shepherd

volumes:
  shepherd-data:
  caddy-data:
  caddy-config:
