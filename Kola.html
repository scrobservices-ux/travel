<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kola — Njangi · Tontine · Trouble Fund</title>
<meta name="description" content="Break kola. Build trust. The digital book for your njangi house.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Kola — premium design system
 * Palette: deep forest (trust), warm sand (kola shell), terracotta (kola nut), brass gold.
 * Type: Sora for display, Inter for UI. Generous radii, soft layered shadows,
 * fluid micro-interactions. Images degrade gracefully offline (gradient art base).
 */
:root {
  --forest: #0c3b2e;
  --forest-2: #14533f;
  --moss: #1e6b51;
  --mint: #e8f3ed;
  --sand: #f7f3ec;
  --cream: #fcfaf5;
  --ink: #11231b;
  --muted: #647a6e;
  --line: #e7e2d6;
  --terra: #c75b39;
  --terra-soft: #f8e7e0;
  --gold: #d99e2b;
  --gold-soft: #f7ecd4;
  --blue: #2b5d99;
  --card: #ffffff;
  --shadow: 0 8px 32px rgba(12, 59, 46, .10);
  --shadow-lg: 0 20px 60px rgba(12, 59, 46, .16);
  --r: 18px;
  --r-sm: 12px;
  --font-display: "Sora", "Inter", -apple-system, sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(217, 158, 43, .10), transparent 60%),
    radial-gradient(900px 480px at -10% 18%, rgba(12, 59, 46, .07), transparent 55%),
    var(--sand);
  color: var(--ink);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .display { font-family: var(--font-display); letter-spacing: -.01em; }

/* ---------- topbar ---------- */
#topbar {
  background: rgba(252, 250, 245, .82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(231, 226, 214, .8);
  color: var(--ink);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.logo {
  background: linear-gradient(135deg, var(--terra), #a8431f);
  color: #fff;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 13px;
  box-shadow: 0 6px 16px rgba(199, 91, 57, .35);
}
.brand h1 { margin: 0; font-size: 19px; line-height: 1.05; font-weight: 800; color: var(--forest); }
.brand p { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
#topbar select {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 7px 10px; font-size: 13px; font-family: inherit; color: var(--ink);
}

/* ---------- layout ---------- */
#layout { display: flex; min-height: calc(100vh - 61px); }
body.landing-mode #sidebar { display: none; }
body.landing-mode #main { max-width: none; padding: 0; }

#sidebar {
  width: 250px; flex-shrink: 0;
  padding: 16px 12px;
  display: flex; flex-direction: column;
}
.sidebar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
.sidebar-head h2 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
#groupList { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; }
#groupList li {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 14px; cursor: pointer; margin-bottom: 6px;
  border: 1px solid transparent;
  transition: all .18s ease;
  background: rgba(255,255,255,.5);
}
#groupList li:hover { background: #fff; transform: translateX(2px); box-shadow: var(--shadow); }
#groupList li.active { background: #fff; border-color: var(--forest); box-shadow: var(--shadow); }
.gthumb {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--forest), var(--moss));
  color: #fff; display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.gthumb img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.gthumb svg { position: relative; z-index: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
#groupList .gname { font-weight: 600; display: block; font-size: 14px; }
#groupList .gmeta { font-size: 11.5px; color: var(--muted); }
.sidebar-foot { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
.file-btn input { display: none; }

#main { flex: 1; padding: 22px 26px; max-width: 1040px; }

/* ---------- landing ---------- */
.hero {
  position: relative; overflow: hidden;
  min-height: 480px;
  display: flex; align-items: center;
  background: linear-gradient(140deg, var(--forest) 0%, var(--forest-2) 55%, #0a2e24 100%);
}
.hero .hero-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: .38;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(8, 38, 29, .92) 18%, rgba(8, 38, 29, .45) 60%, rgba(199, 91, 57, .25) 100%);
}
.hero-inner { position: relative; z-index: 2; padding: 64px 6vw; max-width: 760px; animation: fadeUp .7s ease both; }
.hero .badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
  color: #f3e9d8; padding: 7px 14px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  backdrop-filter: blur(6px);
}
.hero h1 {
  color: #fff; font-size: clamp(34px, 5.4vw, 58px); line-height: 1.06;
  margin: 22px 0 14px; font-weight: 800;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(90deg, #f0b95a, var(--gold), #e8884f);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p.sub { color: rgba(255,255,255,.82); font-size: 17.5px; line-height: 1.65; max-width: 540px; margin: 0 0 30px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }

.stats-strip {
  position: relative; z-index: 2;
  display: flex; gap: 30px; flex-wrap: wrap;
  margin-top: 44px;
}
.stats-strip div { color: #fff; }
.stats-strip .n { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.stats-strip .l { font-size: 12.5px; color: rgba(255,255,255,.65); letter-spacing: .03em; }

.section { padding: 56px 6vw; }
.section > h2 { font-size: clamp(24px, 3vw, 34px); margin: 0 0 6px; color: var(--forest); font-weight: 800; }
.section > p.lead { color: var(--muted); margin: 0 0 30px; font-size: 16px; max-width: 600px; }

.type-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.type-card {
  position: relative; border-radius: var(--r); overflow: hidden; cursor: pointer;
  min-height: 250px; display: flex; align-items: flex-end;
  background: linear-gradient(150deg, var(--forest), var(--moss));
  box-shadow: var(--shadow);
  transition: transform .28s cubic-bezier(.2,.8,.25,1), box-shadow .28s ease;
  animation: fadeUp .6s ease both;
}
.type-card:nth-child(2) { animation-delay: .07s; }
.type-card:nth-child(3) { animation-delay: .14s; }
.type-card:nth-child(4) { animation-delay: .21s; }
.type-card:nth-child(5) { animation-delay: .28s; }
.type-card:hover { transform: translateY(-6px) scale(1.012); box-shadow: var(--shadow-lg); }
.type-card img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  transition: transform .6s ease;
}
.type-card:hover img { transform: scale(1.06); }
.type-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,40,31,0) 30%, rgba(8,32,25,.88) 100%);
}
.type-card .tc-body { position: relative; z-index: 2; padding: 18px; color: #fff; }
.type-card .tc-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
}
.type-card h3 { margin: 0 0 4px; font-size: 17px; }
.type-card p { margin: 0; font-size: 13px; color: rgba(255,255,255,.78); line-height: 1.45; }
img.imgfail { display: none; }

.feature-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.feature {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 22px; box-shadow: var(--shadow);
  transition: transform .25s ease, box-shadow .25s ease;
  animation: fadeUp .6s ease both;
}
.feature:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.feature .f-icon {
  width: 44px; height: 44px; border-radius: 13px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--mint); color: var(--forest);
}
.feature h3 { margin: 0 0 6px; font-size: 16px; }
.feature p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }

.quote-band {
  margin: 0 6vw 56px; padding: 40px;
  background: linear-gradient(120deg, var(--forest), var(--forest-2));
  border-radius: 24px; color: #fff; text-align: center;
  box-shadow: var(--shadow-lg);
}
.quote-band p.q { font-family: var(--font-display); font-size: clamp(18px, 2.4vw, 26px); font-weight: 700; margin: 0 0 8px; }
.quote-band p.a { color: rgba(255,255,255,.6); margin: 0; font-size: 13.5px; }

/* ---------- app chrome ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.tabs button {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: rgba(255,255,255,.7); padding: 9px 16px;
  border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: var(--ink); font-family: inherit;
  transition: all .18s ease;
}
.tabs button:hover { background: #fff; transform: translateY(-1px); box-shadow: var(--shadow); }
.tabs button.active { background: var(--forest); color: #fff; border-color: var(--forest); box-shadow: 0 6px 18px rgba(12,59,46,.3); }

.banner {
  position: relative; border-radius: var(--r); overflow: hidden;
  min-height: 150px; display: flex; align-items: flex-end;
  background: linear-gradient(140deg, var(--forest), var(--moss));
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,32,25,.1), rgba(8,32,25,.82)); }
.banner .b-body { position: relative; z-index: 2; padding: 18px 22px; color: #fff; display: flex; align-items: center; gap: 12px; }
.banner h2 { margin: 0; font-size: 22px; }
.banner .b-sub { font-size: 13px; color: rgba(255,255,255,.75); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow);
  animation: fadeUp .45s ease both;
}
.card h3 { margin: 0 0 12px; font-size: 16.5px; display: flex; align-items: center; gap: 9px; color: var(--forest); }
.card h3 svg { color: var(--terra); flex-shrink: 0; }

.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; gap: 12px; align-items: center;
  animation: fadeUp .45s ease both;
  transition: transform .2s ease;
}
.stat:hover { transform: translateY(-3px); }
.stat .s-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat.green .s-icon { background: var(--mint); color: var(--forest); }
.stat.gold .s-icon { background: var(--gold-soft); color: #8a6210; }
.stat.terra .s-icon { background: var(--terra-soft); color: var(--terra); }
.stat.blue .s-icon { background: #e3ecf7; color: var(--blue); }
.stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.stat .value { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-top: 1px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  background: linear-gradient(135deg, var(--forest), var(--forest-2));
  color: #fff; border: none; border-radius: 12px;
  padding: 10px 18px; font-size: 14px; cursor: pointer; font-weight: 600;
  font-family: inherit;
  box-shadow: 0 6px 18px rgba(12,59,46,.25);
  transition: all .18s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(12,59,46,.32); }
.btn:active { transform: scale(.98); }
.btn.small { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
.btn.ghost { background: rgba(255,255,255,.7); color: var(--forest); border: 1px solid var(--forest); box-shadow: none; }
.btn.ghost:hover { background: var(--mint); }
.btn.warn { background: linear-gradient(135deg, var(--terra), #a8431f); box-shadow: 0 6px 18px rgba(199,91,57,.3); }
.btn.gold { background: linear-gradient(135deg, var(--gold), #b97f15); box-shadow: 0 6px 18px rgba(217,158,43,.3); }
.btn.blue { background: linear-gradient(135deg, var(--blue), #1d4474); box-shadow: 0 6px 18px rgba(43,93,153,.3); }
.btn.big { padding: 14px 26px; font-size: 16px; border-radius: 14px; }
.btn.light { background: #fff; color: var(--forest); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

input[type=text], input[type=number], input[type=date], input[type=tel], select, textarea {
  border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px;
  width: 100%; background: #fff; font-family: inherit; color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--moss); box-shadow: 0 0 0 4px rgba(30,107,81,.12);
}
textarea { min-height: 90px; }
label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
label.field span { display: block; margin-bottom: 5px; font-weight: 600; color: var(--ink); font-size: 12.5px; }
.formrow { display: flex; gap: 12px; flex-wrap: wrap; }
.formrow > * { flex: 1; min-width: 140px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: var(--cream); }
tr.paid { background: var(--mint) !important; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.scrollwrap { max-height: 460px; overflow-y: auto; border-radius: var(--r-sm); }

.searchbar { margin-bottom: 12px; position: relative; }
.searchbar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.searchbar input { padding-left: 38px; }

.pill {
  display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
}
.pill.green { background: var(--mint); color: var(--forest); }
.pill.gold { background: var(--gold-soft); color: #8a6210; }
.pill.red { background: var(--terra-soft); color: var(--terra); }
.pill.grey { background: #ecefe9; color: var(--muted); }

.muted { color: var(--muted); font-size: 13px; }
.right { text-align: right; }
.mt { margin-top: 12px; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- modal ---------- */
#modalOverlay {
  position: fixed; inset: 0; background: rgba(10, 32, 25, .6);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
#modalOverlay.hidden { display: none; }
#modalBox {
  background: var(--cream); border-radius: 22px; padding: 24px; width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: popIn .3s cubic-bezier(.2,.9,.3,1.2) both;
}
#modalBox h3 { margin-top: 0; font-size: 20px; color: var(--forest); }

.pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.pick-card {
  position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
  min-height: 96px; display: flex; align-items: flex-end;
  background: linear-gradient(150deg, var(--forest), var(--moss));
  border: 2.5px solid transparent;
  transition: all .18s ease;
}
.pick-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
.pick-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, rgba(8,32,25,.85)); }
.pick-card span { position: relative; z-index: 2; color: #fff; font-weight: 700; font-size: 12.5px; padding: 9px 11px; line-height: 1.25; }
.pick-card:hover { transform: translateY(-2px); }
.pick-card.sel { border-color: var(--terra); box-shadow: 0 0 0 4px rgba(199,91,57,.2); }
.pick-card.sel::before {
  content: "✓"; position: absolute; top: 7px; right: 7px; z-index: 3;
  background: var(--terra); color: #fff; width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800;
}

pre.receipt {
  background: #fff; border: 1.5px dashed var(--moss); border-radius: 14px;
  padding: 16px; white-space: pre-wrap; font-family: inherit; font-size: 14px; line-height: 1.6;
}

.empty { text-align: center; padding: 70px 20px; color: var(--muted); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.92) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@media (max-width: 780px) {
  #layout { flex-direction: column; }
  #sidebar { width: 100%; flex-direction: column; padding: 10px; }
  #groupList { max-height: 150px; }
  #main { padding: 14px; }
  .hero-inner { padding: 48px 22px; }
  .section { padding: 40px 22px; }
  .quote-band { margin: 0 22px 44px; padding: 28px 20px; }
}

</style>
</head>
<body>
<header id="topbar">
  <div class="brand" onclick="App.goHome()">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 3v18M5.5 6.5l13 11M18.5 6.5l-13 11"/>
      </svg>
    </span>
    <div>
      <h1>Kola</h1>
      <p>Break kola · Build trust</p>
    </div>
  </div>
  <div class="topbar-right">
    <select id="langSelect" title="Receipt language" onchange="App.setLang(this.value)">
      <option value="en">Receipts · English</option>
      <option value="fr">Reçus · Français</option>
      <option value="pcm">Receipts · Pidgin</option>
    </select>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h2>Your houses</h2>
      <button class="btn small" onclick="App.showNewGroup()">+ New</button>
    </div>
    <ul id="groupList"></ul>
    <div class="sidebar-foot">
      <button class="btn ghost small" onclick="App.exportAll()">Backup</button>
      <label class="btn ghost small file-btn">Restore
        <input type="file" accept="application/json" onchange="App.importAll(this)">
      </label>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div id="modalOverlay" class="hidden" onclick="if(event.target===this)App.closeModal()">
  <div id="modalBox"></div>
</div>

<script>
/* Kola — Njangi / Tontine / Trouble Fund ledger. ("Break kola. Build trust.")
 * Offline-first: all data lives in localStorage on the treasurer's phone.
 * Works for small groups (5 members) and big ones (200+): bulk import,
 * search filters, and bulk actions everywhere a list can grow.
 * The transaction log is append-only: mistakes are fixed with reversal
 * entries, never by editing history. That is the trust guarantee.
 * Photos are hotlinked from Unsplash and hidden gracefully when offline —
 * the gradient art underneath keeps the design intact without them.
 */
"use strict";

const STORE_KEY = "kola_v1";
const LEGACY_KEY = "tamarun_v1"; // pre-rename data is migrated silently

let state = load();
// Transient UI state (not persisted)
let ui = { tab: "dashboard", sittingId: null, levyId: null, newType: "family" };

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted store: start fresh, user can Restore from backup */ }
  return { groups: [], activeGroupId: null, lang: "en" };
}

function save() {

/* ---------- helpers ---------- */

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);

function fmt(n) {
  return new Intl.NumberFormat("fr-FR").format(Math.round(n)) + " FCFA";
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// hotlinked photo with graceful offline degradation
function photo(src, cls) {
  return `<img src="${esc(src)}" class="${cls || ""}" alt="" loading="lazy" onerror="this.classList.add('imgfail')">`;
}

function activeGroup() {
  return state.groups.find(g => g.id === state.activeGroupId) || null;
}

function member(g, id) {
  return g.members.find(m => m.id === id);
}

function memberName(g, id) {
  const m = member(g, id);
  return m ? m.name : "(removed member)";
}

/* ---------- derived figures ---------- */

function paidForSitting(g, sittingId, memberId) {
  return g.transactions
    .filter(t => t.sittingId === sittingId && t.memberId === memberId &&
                 (t.type === "contribution" || t.type === "reversal-contribution"))
    .reduce((s, t) => s + t.amount, 0);
}

function sittingTotal(g, sittingId) {
  return g.transactions
    .filter(t => t.sittingId === sittingId &&
                 (t.type === "contribution" || t.type === "reversal-contribution" || t.type === "fine"))
    .reduce((s, t) => s + t.amount, 0);
}

function mainFundBalance(g) {
  return g.transactions
    .filter(t => ["contribution", "reversal-contribution", "fine", "payout"].includes(t.type))
    .reduce((s, t) => s + t.amount, 0);
}

function troubleBalance(g) {
  return g.transactions
    .filter(t => ["levy-payment", "reversal-levy", "trouble-payout"].includes(t.type))
    .reduce((s, t) => s + t.amount, 0);
}

function levyPaid(g, levyId, memberId) {
  return g.transactions
    .filter(t => t.levyId === levyId && t.memberId === memberId &&
                 (t.type === "levy-payment" || t.type === "reversal-levy"))
    .reduce((s, t) => s + t.amount, 0);
}

function memberYearTotal(g, memberId) {
  const year = new Date().getFullYear();
  return g.transactions
    .filter(t => t.memberId === memberId && t.date.startsWith(String(year)) &&
                 ["contribution", "reversal-contribution", "levy-payment", "reversal-levy"].includes(t.type))
    .reduce((s, t) => s + t.amount, 0);
}

function activeMembers(g) {
  return g.members.filter(m => m.active);
}

function currentBeneficiary(g) {
  const order = g.rotation.filter(id => { const m = member(g, id); return m && m.active; });
  if (!order.length) return null;
  return member(g, order[g.rotationIndex % order.length]);
}

/* ---------- transactions (append-only) ---------- */

function addTx(g, tx) {
  g.transactions.push(Object.assign({
    id: uid(),
    date: todayISO(),
    ts: Date.now(),
  }, tx));
  save();
}

/* ---------- receipts ---------- */

const RECEIPTS = {
  en: (p) => `KOLA RECEIPT — ${p.group}\n${p.name} paid ${p.amount} (${p.method}) for ${p.what} on ${p.date}.\nTotal paid this year: ${p.yearTotal}.\nThank you!`,
  fr: (p) => `REÇU KOLA — ${p.group}\n${p.name} a payé ${p.amount} (${p.method}) pour ${p.what} le ${p.date}.\nTotal payé cette année : ${p.yearTotal}.\nMerci !`,
  pcm: (p) => `KOLA RECEIPT — ${p.group}\n${p.name} don pay ${p.amount} (${p.method}) for ${p.what} on ${p.date}.\nTotal weh you don pay dis year na: ${p.yearTotal}.\nTank you plenty!`,
};

function receiptText(g, tx) {
  const what =
    tx.type === "levy-payment" ? (state.lang === "fr" ? "levée du fonds de secours" : "trouble fund levy") :
    tx.sittingId ? (state.lang === "fr" ? "la séance" : "di sitting / the sitting") :
    (state.lang === "fr" ? "cotisation" : "contribution");
  return RECEIPTS[state.lang || "en"]({
    group: g.name,
    name: memberName(g, tx.memberId),
    amount: fmt(tx.amount),
    method: tx.method || "cash",
    what,
    date: tx.date,
    yearTotal: fmt(memberYearTotal(g, tx.memberId)),
  });
}

/* ---------- rendering ---------- */

function render() {
  renderSidebar();
  const g = activeGroup();
  const main = document.getElementById("main");
  document.body.classList.toggle("landing-mode", !g);
  if (!g) {
    main.innerHTML = viewLanding();
    return;
  }
  const tabs = [
    ["dashboard", "Dashboard", "grid"],
    ["members", `Members · ${activeMembers(g).length}`, "users"],
    ["sittings", "Sittings & Pot", "coins"],
    ["trouble", "Trouble Fund", "shield"],
    ["ledger", "Ledger", "book"],
    ["settings", "Settings", "gear"],
  ];
  let html = `<div class="tabs">` + tabs.map(([id, label, ic]) =>
    `<button class="${ui.tab === id ? "active" : ""}" onclick="App.tab('${id}')">${icon(ic, 15)}${label}</button>`
  ).join("") + `</div>`;

  if (ui.tab === "dashboard") html += viewDashboard(g);
  else if (ui.tab === "members") html += viewMembers(g);
  else if (ui.tab === "sittings") html += viewSittings(g);
  else if (ui.tab === "trouble") html += viewTrouble(g);
  else if (ui.tab === "ledger") html += viewLedger(g);
  else if (ui.tab === "settings") html += viewSettings(g);

  main.innerHTML = html;
}

  if (sel) ui.sittingId = sel.id;

  let html = `
  <div class="card">
    <h3>${icon("plus", 17)} Open a new sitting</h3>

    `</select></div>`;

  const ben = currentBeneficiary(g);
  const members = activeMembers(g);
  const paidCount = members.filter(m => paidForSitting(g, sel.id, m.id) >= g.contribution).length;

  const rows = members.map(m => {
    const paid = paidForSitting(g, sel.id, m.id);

    return `

      <td>${esc(m.name)}</td>

      <td class="right row-actions">
        ${sel.closed ? "" : `
          <button class="btn small" ${done ? "disabled" : ""} onclick="App.pay('${sel.id}','${m.id}','cash')">Cash</button>
          <button class="btn small gold" ${done ? "disabled" : ""} onclick="App.pay('${sel.id}','${m.id}','MoMo/OM')">MoMo</button>
          ${paid > 0 ? `<button class="btn small warn" onclick="App.reverse('${sel.id}','${m.id}')">Reverse</button>` : ""}`}
        ${paid > 0 ? `<button class="btn small blue" onclick="App.receiptFor('${sel.id}','${m.id}')">${icon("receipt", 13)} Receipt</button>` : ""}
      </td>

  }).join("");

  html += `
  <div class="statgrid">
    <div class="stat green"><div class="s-icon">${icon("coins", 20)}</div><div><div class="label">Collected this sitting</div><div class="value">${fmt(sittingTotal(g, sel.id))}</div></div></div>

    <div class="stat gold"><div class="s-icon">${icon("heart", 20)}</div><div><div class="label">Pot beneficiary</div><div class="value">${ben ? esc(ben.name) : "—"}</div></div></div>
  </div>
  <div class="card mt">
    <h3>${icon("coins", 17)} Contributions — ${fmt(g.contribution)} each</h3>
    ${searchBox("Search member… (big houses)")}
    ${sel.closed ? `<p class="muted">This sitting is closed.</p>` : `
    <div class="row-actions" style="justify-content:flex-start;margin-bottom:12px">
      <button class="btn ghost small" onclick="App.payAllUnpaid('${sel.id}','cash')">Mark ALL unpaid as paid (cash)</button>
      <button class="btn ghost small" onclick="App.fineUnpaid('${sel.id}')">Fine all unpaid (${fmt(g.fineLate || 0)})</button>
    </div>`}
    <div class="scrollwrap">
      <table><thead><tr><th>Member</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  </div>
  <div class="card">
    <h3>${icon("heart", 17)} Close & disburse</h3>
    <p class="muted">Pot for this sitting: <b>${fmt(sittingTotal(g, sel.id))}</b> → goes to <b>${ben ? esc(ben.name) : "—"}</b>.</p>
    ${sel.closed
      ? `<span class="pill grey">Closed${sel.disbursedTo ? " — pot paid to " + esc(memberName(g, sel.disbursedTo)) : ""}</span>`
      : `<div class="row-actions" style="justify-content:flex-start">
           <button class="btn" ${ben ? "" : "disabled"} onclick="App.disburse('${sel.id}')">Disburse pot & close sitting</button>
           <button class="btn ghost" onclick="App.closeSittingOnly('${sel.id}')">Close without payout (savings round)</button>
         </div>`}
  </div>`;
  return html;
}

/* ----- trouble fund ----- */

function viewTrouble(g) {
  const levies = g.levies.slice().reverse();
  const sel = g.levies.find(l => l.id === ui.levyId) || levies[0] || null;
  if (sel) ui.levyId = sel.id;

  let html = `
  <div class="statgrid">
    <div class="stat gold"><div class="s-icon">${icon("shield", 20)}</div><div><div class="label">Trouble fund balance</div><div class="value">${fmt(troubleBalance(g))}</div></div></div>
  </div>
  <div class="card mt">
    <h3>${icon("shield", 17)} Raise an emergency levy</h3>
    <p class="muted">A death or emergency: every member owes a fixed amount, right now. This is the 48-hour promise.</p>
    <div class="formrow">
      <label class="field"><span>Reason</span><input type="text" id="levyReason" placeholder="e.g. Death of Pa Tanyi — burial support"></label>
      <label class="field"><span>Amount per member</span><input type="number" id="levyAmount" placeholder="5000"></label>
    </div>
    <button class="btn warn" onclick="App.addLevy()">Launch levy</button>
  </div>
  <div class="card">
    <h3>${icon("heart", 17)} Pay out from trouble fund</h3>
    <div class="formrow">
      <label class="field"><span>Beneficiary member</span>
        <select id="tpMember">${activeMembers(g).map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>
      </label>
      <label class="field"><span>Amount</span><input type="number" id="tpAmount" placeholder="150000"></label>
      <label class="field"><span>Reason</span><input type="text" id="tpReason" placeholder="Burial benefit per constitution"></label>
    </div>
    <button class="btn gold" onclick="App.troublePayout()">Record payout</button>
  </div>`;

  if (!sel) return html + `<div class="card"><p class="muted">No levies yet.</p></div>`;

  html += `<div class="card"><h3>${icon("shield", 17)} Levy</h3>
    <select onchange="App.selectLevy(this.value)">` +
    levies.map(l => `<option value="${l.id}" ${l.id === sel.id ? "selected" : ""}>${l.date} — ${esc(l.reason)} (${fmt(l.amount)}/member)</option>`).join("") +
    `</select></div>`;

  const members = activeMembers(g);
  const paidCount = members.filter(m => levyPaid(g, sel.id, m.id) >= sel.amount).length;
  const collected = g.transactions
    .filter(t => t.levyId === sel.id && (t.type === "levy-payment" || t.type === "reversal-levy"))
    .reduce((s, t) => s + t.amount, 0);

  const rows = members.map(m => {
    const paid = levyPaid(g, sel.id, m.id);
    const done = paid >= sel.amount;
    return `
    <tr class="${done ? "paid" : ""}" data-search="${esc(m.name.toLowerCase())}">
      <td>${esc(m.name)}</td>
      <td>${done ? '<span class="pill green">Paid</span>' : '<span class="pill red">Owing</span>'}</td>
      <td class="right row-actions">
        ${done
          ? `<button class="btn small blue" onclick="App.levyReceiptFor('${sel.id}','${m.id}')">${icon("receipt", 13)} Receipt</button>`
          : `<button class="btn small" onclick="App.payLevy('${sel.id}','${m.id}','cash')">Cash</button>
             <button class="btn small gold" onclick="App.payLevy('${sel.id}','${m.id}','MoMo/OM')">MoMo</button>`}
      </td>
    </tr>`;
  }).join("");

  html += `
  <div class="card">
    <h3>${icon("candle", 17)} ${esc(sel.reason)} — ${fmt(sel.amount)} per member</h3>
    <p class="muted">Collected: <b>${fmt(collected)}</b> · ${paidCount}/${members.length} members paid.</p>
    ${searchBox("Search member…")}
    <div class="scrollwrap">
      <table><thead><tr><th>Member</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  </div>`;
  return html;
}

/* ----- ledger ----- */

function viewLedger(g) {
  const txs = g.transactions.slice().reverse();
  const rows = txs.map(t => `
    <tr data-search="${esc(memberName(g, t.memberId).toLowerCase())} ${esc(txLabel(t).toLowerCase())}">
      <td>${t.date}</td>
      <td>${esc(memberName(g, t.memberId))}</td>
      <td>${esc(txLabel(t))}</td>
      <td>${esc(t.method || "")}</td>
      <td>${esc(t.note || "")}</td>
      <td class="num">${fmt(t.amount)}</td>
    </tr>`).join("");
  return `
  <div class="card">
    <h3>${icon("book", 17)} Full ledger — append-only (${txs.length} entries)</h3>
    <p class="muted">Nobody can edit or delete history; corrections appear as reversal entries. That is the point.</p>
    <div class="row-actions" style="justify-content:flex-start;margin-bottom:12px">
      <button class="btn ghost small" onclick="App.exportCSV()">${icon("download", 13)} Export CSV</button>
    </div>
    ${searchBox("Filter by member or type…")}
    <div class="scrollwrap">
      <table><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Method</th><th>Note</th><th class="num">Amount</th></tr></thead>
      <tbody>${rows || ""}</tbody></table>
    </div>
  </div>`;
}

/* ----- settings ----- */

function viewSettings(g) {
  const order = g.rotation
    .map(id => member(g, id)).filter(m => m && m.active);
  const orderRows = order.map((m, i) => `
    <tr class="${i === (g.rotationIndex % (order.length || 1)) ? "paid" : ""}">
      <td>${i + 1}</td><td>${esc(m.name)}</td>
      <td class="right row-actions">
        <button class="btn small ghost" ${i === 0 ? "disabled" : ""} onclick="App.moveRotation('${m.id}',-1)">↑</button>
        <button class="btn small ghost" ${i === order.length - 1 ? "disabled" : ""} onclick="App.moveRotation('${m.id}',1)">↓</button>
      </td>
    </tr>`).join("");

  const typePicker = Object.entries(TYPES).map(([key, t]) => `
    <div class="pick-card ${g.type === key ? "sel" : ""}" onclick="App.setGroupType('${key}')">
      ${photo(t.img)}<span>${t.label}</span>
    </div>`).join("");

  return `
  <div class="card">
    <h3>${icon("gear", 17)} House settings</h3>
    <div class="formrow">
      <label class="field"><span>House name</span><input type="text" id="gName" value="${esc(g.name)}"></label>
      <label class="field"><span>Contribution per sitting</span><input type="number" id="gContribution" value="${g.contribution}"></label>
    </div>
    <div class="formrow">
      <label class="field"><span>Frequency</span>
        <select id="gFrequency">
          ${["weekly", "bi-weekly", "monthly"].map(f => `<option ${g.frequency === f ? "selected" : ""}>${f}</option>`).join("")}
        </select></label>
      <label class="field"><span>Late fine</span><input type="number" id="gFine" value="${g.fineLate || 0}"></label>
    </div>
    <button class="btn" onclick="App.saveSettings()">Save settings</button>
  </div>
  <div class="card">
    <h3>${icon("spark", 17)} Kind of house</h3>
    <div class="pick-grid">${typePicker}</div>
  </div>
  <div class="card">
    <h3>${icon("dice", 17)} Rotation order — who chops the pot next</h3>
    <p class="muted">Highlighted row = next beneficiary. Use the ballot draw to shuffle fairly in front of everyone.</p>
    <button class="btn ghost small" onclick="App.shuffleRotation()">${icon("dice", 14)} Ballot draw (shuffle)</button>
    <div class="scrollwrap mt">
      <table><thead><tr><th>#</th><th>Member</th><th></th></tr></thead><tbody>${orderRows}</tbody></table>
    </div>
  </div>
  <div class="card">
    <h3>${icon("download", 17)} Data</h3>
    <div class="row-actions" style="justify-content:flex-start">
      <button class="btn ghost" onclick="App.exportGroup()">Export this house (JSON)</button>
      <button class="btn warn" onclick="App.deleteGroup()">Delete house</button>
    </div>
    <p class="muted mt">Houses can always leave with their full books. Back up after every sitting.</p>
  </div>`;
}

/* ---------- modal ---------- */

function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalOverlay").classList.remove("hidden");
}

/* ---------- App: actions wired to the UI ---------- */

const App = {

  /* navigation */
  tab(t) { ui.tab = t; render(); },
  goHome() { render(); },
  selectGroup(id) { state.activeGroupId = id; ui = { tab: "dashboard", sittingId: null, levyId: null, newType: ui.newType }; save(); render(); },
  selectSitting(id) { ui.sittingId = id; render(); },
  selectLevy(id) { ui.levyId = id; render(); },
  setLang(l) { state.lang = l; save(); },
  closeModal() { document.getElementById("modalOverlay").classList.add("hidden"); },

  /* live search filter on any table (no re-render, keeps keyboard focus) */
  filterRows(input) {
    const q = input.value.trim().toLowerCase();
    const card = input.closest(".card");
    card.querySelectorAll("tbody tr").forEach(tr => {
      const hay = tr.getAttribute("data-search") || "";
      tr.style.display = !q || hay.includes(q) ? "" : "none";
    });
  },

  /* group lifecycle */
  showNewGroup(presetType) {
    ui.newType = presetType || ui.newType || "family";
    const typeCards = Object.entries(TYPES).map(([key, t]) => `
      <div class="pick-card ${ui.newType === key ? "sel" : ""}" data-type="${key}" onclick="App.pickType(this)">
        ${photo(t.img)}<span>${t.label}</span>
      </div>`).join("");
    openModal(`
      <h3>New house</h3>
      <p class="muted" style="margin-top:-8px">What kind of njangi is this?</p>
      <div class="pick-grid">${typeCards}</div>
      <label class="field"><span>House name</span><input type="text" id="ngName" placeholder="e.g. Mankon Family Njangi"></label>
      <div class="formrow">
        <label class="field"><span>Contribution per sitting (FCFA)</span><input type="number" id="ngContribution" value="5000"></label>
        <label class="field"><span>Frequency</span>
          <select id="ngFrequency"><option>weekly</option><option>bi-weekly</option><option selected>monthly</option></select>
        </label>
      </div>
      <label class="field"><span>Late fine (FCFA, 0 = none)</span><input type="number" id="ngFine" value="500"></label>
      <button class="btn" onclick="App.createGroup()">Create house</button>`);
  },

  pickType(el) {
    ui.newType = el.getAttribute("data-type");
    el.parentElement.querySelectorAll(".pick-card").forEach(c => c.classList.remove("sel"));
    el.classList.add("sel");
  },

  createGroup() {
    const name = document.getElementById("ngName").value.trim();
    if (!name) return alert("Give the house a name.");
    const g = {
      id: uid(),
      name,
      type: ui.newType || "family",
      contribution: Number(document.getElementById("ngContribution").value) || 0,
      frequency: document.getElementById("ngFrequency").value,
      fineLate: Number(document.getElementById("ngFine").value) || 0,
      rotationMode: "fixed",
      rotationIndex: 0,
      members: [],
      rotation: [],
      sittings: [],
      levies: [],
      transactions: [],
    };
    state.groups.push(g);
    state.activeGroupId = g.id;
    ui.tab = "members"; ui.sittingId = null; ui.levyId = null;
    save(); this.closeModal(); render();
  },

  setGroupType(key) {
    const g = activeGroup();
    g.type = key;
    save(); render();
  },

  saveSettings() {
    const g = activeGroup();
    g.name = document.getElementById("gName").value.trim() || g.name;
    g.contribution = Number(document.getElementById("gContribution").value) || g.contribution;
    g.frequency = document.getElementById("gFrequency").value;
    g.fineLate = Number(document.getElementById("gFine").value) || 0;
    save(); render();
  },

  deleteGroup() {
    const g = activeGroup();
    if (!confirm(`Delete "${g.name}" and its entire ledger from this phone? Export a backup first!`)) return;
    state.groups = state.groups.filter(x => x.id !== g.id);
    state.activeGroupId = state.groups.length ? state.groups[0].id : null;
    save(); render();
  },

  /* members */
  addMember() {
    const g = activeGroup();
    const name = document.getElementById("mName").value.trim();
    if (!name) return alert("Enter a name.");
    const m = { id: uid(), name, phone: document.getElementById("mPhone").value.trim(), active: true };
    g.members.push(m);
    g.rotation.push(m.id);
    save(); render();
  },

  bulkAddMembers() {
    const g = activeGroup();
    const lines = document.getElementById("mBulk").value.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) return alert("Paste at least one line.");
    for (const line of lines) {
      const [name, phone] = line.split(",").map(s => (s || "").trim());
      if (!name) continue;
      const m = { id: uid(), name, phone: phone || "", active: true };
      g.members.push(m);
      g.rotation.push(m.id);
    }
    save(); render();
  },

  toggleMember(id) {
    const g = activeGroup();
    const m = member(g, id);
    m.active = !m.active;
    save(); render();
  },

  /* sittings & contributions */
  addSitting() {
    const g = activeGroup();
    const s = {
      id: uid(),
      date: document.getElementById("sitDate").value || todayISO(),
      label: document.getElementById("sitLabel").value.trim(),
      closed: false,
      disbursedTo: null,
    };
    g.sittings.push(s);
    ui.sittingId = s.id;
    save(); render();
  },

  pay(sittingId, memberId, method) {
    const g = activeGroup();
    const remaining = g.contribution - paidForSitting(g, sittingId, memberId);
    if (remaining <= 0) return;
    addTx(g, { type: "contribution", memberId, sittingId, amount: remaining, method });
    render();
  },

  payAllUnpaid(sittingId, method) {
    const g = activeGroup();
    const unpaid = activeMembers(g).filter(m => paidForSitting(g, sittingId, m.id) < g.contribution);
    if (!unpaid.length) return alert("Everyone has paid.");
    if (!confirm(`Mark ${unpaid.length} members as paid (${method})?`)) return;
    for (const m of unpaid) {
      addTx(g, { type: "contribution", memberId: m.id, sittingId, amount: g.contribution - paidForSitting(g, sittingId, m.id), method });
    }
    render();
  },

  reverse(sittingId, memberId) {
    const g = activeGroup();
    const paid = paidForSitting(g, sittingId, memberId);
    if (paid <= 0) return;
    if (!confirm(`Reverse ${fmt(paid)} recorded for ${memberName(g, memberId)}? A correction entry will be added (history is never deleted).`)) return;
    addTx(g, { type: "reversal-contribution", memberId, sittingId, amount: -paid, note: "Correction" });
    render();
  },

  fineUnpaid(sittingId) {
    const g = activeGroup();
    if (!g.fineLate) return alert("Set a late fine amount in Settings first.");
    const unpaid = activeMembers(g).filter(m => paidForSitting(g, sittingId, m.id) < g.contribution);
    if (!unpaid.length) return alert("Everyone has paid — nobody to fine.");
    if (!confirm(`Record a ${fmt(g.fineLate)} fine (collected) for ${unpaid.length} unpaid members?`)) return;
    for (const m of unpaid) {
      addTx(g, { type: "fine", memberId: m.id, sittingId, amount: g.fineLate, method: "cash", note: "Late fine" });
    }
    render();
  },

  disburse(sittingId) {
    const g = activeGroup();
    const ben = currentBeneficiary(g);
    if (!ben) return;
    const pot = sittingTotal(g, sittingId);
    if (!confirm(`Pay the pot of ${fmt(pot)} to ${ben.name} and close this sitting?`)) return;
    addTx(g, { type: "payout", memberId: ben.id, sittingId, amount: -pot, method: "MoMo/OM or cash", note: "Pot disbursement" });
    const s = g.sittings.find(x => x.id === sittingId);
    s.closed = true;
    s.disbursedTo = ben.id;
    g.rotationIndex += 1;
    save(); render();
  },

  closeSittingOnly(sittingId) {
    const g = activeGroup();
    const s = g.sittings.find(x => x.id === sittingId);
    s.closed = true;
    save(); render();
  },

  /* trouble fund */
  addLevy() {
    const g = activeGroup();
    const reason = document.getElementById("levyReason").value.trim();
    const amount = Number(document.getElementById("levyAmount").value);
    if (!reason || !amount) return alert("Enter a reason and an amount per member.");
    const l = { id: uid(), date: todayISO(), reason, amount };
    g.levies.push(l);
    ui.levyId = l.id;
    save(); render();
  },

  payLevy(levyId, memberId, method) {
    const g = activeGroup();
    const l = g.levies.find(x => x.id === levyId);
    const remaining = l.amount - levyPaid(g, levyId, memberId);
    if (remaining <= 0) return;
    addTx(g, { type: "levy-payment", memberId, levyId, amount: remaining, method, note: l.reason });
    render();
  },

  troublePayout() {
    const g = activeGroup();
    const memberId = document.getElementById("tpMember").value;
    const amount = Number(document.getElementById("tpAmount").value);
    const reason = document.getElementById("tpReason").value.trim();
    if (!amount) return alert("Enter an amount.");
    const bal = troubleBalance(g);
    if (amount > bal && !confirm(`Payout ${fmt(amount)} is more than the fund balance (${fmt(bal)}). Record anyway?`)) return;
    addTx(g, { type: "trouble-payout", memberId, amount: -amount, note: reason || "Trouble fund benefit" });
    render();
  },

  /* receipts */
  receiptFor(sittingId, memberId) {
    const g = activeGroup();
    const tx = g.transactions.slice().reverse()
      .find(t => t.sittingId === sittingId && t.memberId === memberId && t.type === "contribution");
    if (!tx) return;
    this.showReceipt(receiptText(g, tx));
  },

  levyReceiptFor(levyId, memberId) {
    const g = activeGroup();
    const tx = g.transactions.slice().reverse()
      .find(t => t.levyId === levyId && t.memberId === memberId && t.type === "levy-payment");
    if (!tx) return;
    this.showReceipt(receiptText(g, tx));
  },

  showReceipt(text) {
    openModal(`
      <h3>Receipt</h3>
      <pre class="receipt" id="receiptText">${esc(text)}</pre>
      <div class="row-actions" style="justify-content:flex-start">
        <button class="btn" onclick="App.copyReceipt()">Copy for WhatsApp/SMS</button>
        <button class="btn ghost" onclick="App.closeModal()">Close</button>
      </div>`);
  },

  copyReceipt() {
    const text = document.getElementById("receiptText").innerText;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => alert("Copied! Paste it in WhatsApp or SMS."))
      .catch(() => prompt("Copy the receipt below:", text));
  },

  /* rotation */
  shuffleRotation() {
    const g = activeGroup();
    if (!confirm("Shuffle the rotation order (ballot draw)? Do this in front of the members!")) return;
    for (let i = g.rotation.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [g.rotation[i], g.rotation[j]] = [g.rotation[j], g.rotation[i]];
    }
    g.rotationIndex = 0;
    save(); render();
  },

  moveRotation(memberId, dir) {
    const g = activeGroup();
    const i = g.rotation.indexOf(memberId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= g.rotation.length) return;
    [g.rotation[i], g.rotation[j]] = [g.rotation[j], g.rotation[i]];
    save(); render();
  },

  /* import / export */
  exportAll() { downloadJSON(state, "kola-backup-" + todayISO() + ".json"); },

  exportGroup() {
    const g = activeGroup();
    downloadJSON(g, "kola-" + g.name.replace(/\W+/g, "-").toLowerCase() + "-" + todayISO() + ".json");
  },

  importAll(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.groups) {
          if (!confirm("Replace ALL data on this phone with the backup?")) return;
          state = data;
        } else if (data.id && data.members) {
          state.groups.push(data); // single-group file: add it
          state.activeGroupId = data.id;
        } else {
          throw new Error("unrecognized");
        }
        save(); render();
        alert("Restore complete.");
      } catch (e) {
        alert("That file is not a valid Kola backup.");
      }
      input.value = "";
    };
    reader.readAsText(file);
  },

  exportCSV() {
    const g = activeGroup();
    const head = "date,member,type,method,note,amount\n";
    const body = g.transactions.map(t =>
      [t.date, csv(memberName(g, t.memberId)), t.type, csv(t.method), csv(t.note), t.amount].join(",")
    ).join("\n");
    const blob = new Blob([head + body], { type: "text/csv" });
    triggerDownload(blob, "kola-ledger-" + todayISO() + ".csv");
  },
};

function csv(s) {
  s = String(s == null ? "" : s);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  triggerDownload(blob, filename);
}

function triggerDownload(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

window.App = App;
render();

</script>
</body>
</html>
